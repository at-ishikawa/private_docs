title = "at-ishikawa's Private notes"
baseURL = 'https://example.org/'
defaultContentLanguage = 'en'

# Theme: Hextra (installed as a Hugo Module)
# https://imfing.github.io/hextra/
[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

# Enable raw HTML in markdown (some notes contain inline HTML) and syntax classes
[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true

[params]
  [params.navbar]
    displayTitle = true
    displayLogo = false

  [params.theme]
    default = 'system'   # light | dark | system
    displayToggle = true

  [params.page]
    width = 'normal'

  # Full-text search across all documents
  [params.search]
    enable = true
    type = 'flexsearch'
    [params.search.flexsearch]
      index = 'content'   # index full page content

  [params.footer]
    enable = true
    displayCopyright = false
    displayPoweredBy = true

  # These are private notes, not a public doc site — hide "edit this page" links
  [params.editURL]
    enable = false

# Top navigation bar
[[menu.main]]
  name = 'Search'
  weight = 100
  [menu.main.params]
    type = 'search'
